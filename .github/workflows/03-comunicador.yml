
name: Comunicador de la leigion

# Controls when the workflow will run
on:
  
  workflow_dispatch:
    inputs:
      villano:
        desciption: " Nivel de prioridad"
        required: true
        type: choice
        options:
          - Normal
          - Alta
          - Critica

    mensaje:
      desciption: "Mensaje para el consejo"
      required: true
      default: "La mision fue un exito"
          

    inputs:
      villano:
        desciption: " Que villano envia el mensaje?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Joker
          - Darkseid
          - Sinestro

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  Transmitir-mensaje:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

