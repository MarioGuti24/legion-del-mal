
name: Comunicador de la leigion

# Controls when the workflow will run
on:
  
  workflow_dispatch:
    inputs:
       villano:
          description: " Que villano envia el mensaje?"
          required: true
          type: choice
          options:
            - Lex Luthor
            - Joker
            - Darkseid
            - Sinestro

        
       cow_character:
          description: " Personaje"
          required: true
          type: choice
          options:
            - eyes
            - ghostbusters
            - dragon
            - fox
            - king


       prioridad:
          description: " Nivel de prioridad"
          required: true
          type: choice
          options:
            - Normal
            - Alta
            - Critica

       mensaje:
          description: "Mensaje para el consejo"
          required: true
          default: "La mision fue un exito"
          

     
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  Transmitir-mensaje:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

      - name: Instalar el trnasmisor de la legión.
        run: sudo apt-get install -y cowsay


      - name: Imprimir inputs
        run: |
          echo "Imprimir Inputs:"
          echo "=================================="
          echo "Transmision interceptada"
          echo ""
          echo "De: ${{ inputs.villano }}"
          echo ""
          echo "Fecha: $(date -u +"%d/%m/%Y - %H:%M:%S")"
          echo "----Mensaje-----"
          cowsay -f eyes "${{ inputs.mensaje }}"
          echo ""
          echo "---- ${{ inputs.villano }}"
          echo "..."


